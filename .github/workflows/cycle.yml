# Orvane — le cycle : chaque heure, l'action regarde chaque monde ; celui dont l'heure de cycle est venue avance (docs/19),
# et le site est publié. Un monde au jour (monde.cycle = "24h", le monde d'Orvane) tourne une fois par jour, à son heure
# (monde.heure, 03:00 UTC par défaut) ; une passe manquée est rattrapée à la suivante (au plus monde.rattrapage cycles d'un coup).
# Secret du dépôt à renseigner : ORVANE_LECTURE_SECRET (le secret de lecture ; où lire est dans profil.monde.pressions).
#
# La publication (hebergement/publication.js) : le site est servi par GitHub Pages depuis la branche `publication`
# (Settings › Pages : « Deploy from a branch », branche publication, dossier /). L'action la réécrit à chaque passe en un seul
# commit, sans historique : le code de main, et l'état de chaque monde. L'état d'un monde se reprend de la publication au début de
# chaque passe ; main garde le code et ce qu'on écrit à la main (profil.json, amorce.json…). Un changement poussé sur main est
# publié dans la foulée, sans faire tourner un monde avant son heure.
#
# Les sauvegardes : chaque passe où un monde a tourné garde son état dans un artefact de l'action (« etat-mondes », 30 jours). Pour
# revenir en arrière : Actions › cycle › Run workflow, et dans « restaurer », le numéro de la passe dont on veut l'état (le nombre à la
# fin de l'adresse de sa page). La passe repart de cet état, puis fait les cycles dus (hebergement/LISEZ-MOI.md, « Les sauvegardes »).
name: cycle
on:
  schedule:
    - cron: '17 * * * *'      # à la 17ᵉ minute de chaque heure : chaque monde décide s'il est l'heure (hebergement/cycle.js --auto)
  push:
    branches: [main]          # le code a changé : on republie (les mondes ne tournent qu'à leur heure)
  workflow_dispatch:
    inputs:
      cycles:
        description: 'nombre de cycles à faire tourner (vide : les cycles dus)'
        default: ''
      restaurer:
        description: "revenir en arrière : le numéro de la passe dont on reprend l'état sauvegardé (vide : rien)"
        default: ''
permissions:
  contents: write
  actions: read          # (lire la sauvegarde d'une autre passe)
concurrency:
  group: cycle
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: reprendre l'état des mondes (branche publication)
        run: |
          if git fetch -q --depth=1 origin publication 2>/dev/null; then
            echo "PUBLIE=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
            mkdir -p "$RUNNER_TEMP/publication" && git archive FETCH_HEAD mondes | tar -x -C "$RUNNER_TEMP/publication"
            node hebergement/publication.js reprendre "$RUNNER_TEMP/publication"
          else
            echo "pas encore de branche publication : les mondes partent de main"
          fi
          # revenir en arrière : l'état sauvegardé par une passe passée remplace celui de la publication
          if printf '%s' "$RESTAURER" | grep -Eq '^[0-9]{5,}$'; then
            gh run download "$RESTAURER" -n etat-mondes -D "$RUNNER_TEMP/restauration" || { echo "::error title=restauration::pas de sauvegarde « etat-mondes » dans la passe $RESTAURER (elle a peut-être plus de 30 jours, ou aucun monde n'y a tourné)"; exit 1; }
            node hebergement/publication.js restaurer "$RUNNER_TEMP/restauration"
          elif [ -n "$RESTAURER" ]; then echo "::error title=restauration::« $RESTAURER » n'est pas un numéro de passe"; exit 1; fi
          cp -a mondes "$RUNNER_TEMP/avant"            # (pour rendre à un monde en panne son dossier tel qu'il était)
        env:
          RESTAURER: ${{ github.event.inputs.restaurer }}
          GH_TOKEN: ${{ github.token }}
      - name: faire tourner chaque monde
        id: tourner
        continue-on-error: true          # un monde en panne n'empêche pas les autres d'être publiés
        env:
          ORVANE_LECTURE_SECRET: ${{ secrets.ORVANE_LECTURE_SECRET }}   # le secret de lecture (profil.monde.pressions) : pas la clé de service du jeu
          CYCLES: ${{ github.event.inputs.cycles }}                     # (passé par l'environnement, jamais collé dans le script)
        run: |
          echec=0
          for m in mondes/*/; do
            id="$(basename "$m")"
            if printf '%s' "$CYCLES" | grep -Eq '^[0-9]{1,4}$'; then set -- --cycles "$CYCLES"; else set -- --auto; fi
            c=0; node hebergement/cycle.js "$id" "$@" || c=$?
            if [ "$c" = 2 ]; then echec=1                     # le monde a tourné, mais sans les lots en ligne (le message dit pourquoi)
            elif [ "$c" != 0 ]; then
              # un monde interrompu en route n'est pas publié à moitié : on rend son dossier tel qu'il était
              rm -rf "$m" && cp -a "$RUNNER_TEMP/avant/$id" "$m"
              echo "::error::le monde $id n'a pas tourné (son dossier est laissé tel qu'il était)"; echec=1
            fi
          done
          exit $echec
      - name: sauvegarder l'état des mondes qui ont tourné
        id: sauvegarde
        run: |
          n=0; mkdir -p "$RUNNER_TEMP/sauvegarde/mondes"
          for m in mondes/*/; do id=$(basename "$m")
            if [ -f "$m/etat.json" ] && ! cmp -s "$m/etat.json" "$RUNNER_TEMP/avant/$id/etat.json"; then cp -a "$m" "$RUNNER_TEMP/sauvegarde/mondes/$id"; n=$((n+1)); fi
          done
          echo "n=$n" >> "$GITHUB_OUTPUT"; echo "$n monde(s) à sauvegarder"
      - name: la sauvegarde (un artefact de la passe, gardé 30 jours)
        if: steps.sauvegarde.outputs.n != '0'
        uses: actions/upload-artifact@v4
        with:
          name: etat-mondes
          path: ${{ runner.temp }}/sauvegarde
          retention-days: 30
          compression-level: 9
      - name: Godot 4.3 et ses modèles web, gardés d'une passe à l'autre
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/orvane/godot-4.3
            ~/.local/share/godot/export_templates/4.3.stable
          key: godot-4.3-stable-web
      - name: le jeu Lisière, pour un navigateur (lisiere/, jeux/lisiere/LISEZ-MOI.md)
        continue-on-error: true          # un export manqué ne retient pas la publication des mondes
        run: |
          # refait seulement quand le jeu a changé ; sinon, l'export de la dernière publication est repris tel quel
          source=$(git rev-parse HEAD:jeux/lisiere)
          if [ -n "$PUBLIE" ] && [ "$(git show "$PUBLIE:lisiere/source.txt" 2>/dev/null)" = "$source" ]; then
            git archive "$PUBLIE" lisiere | tar -x
            echo "le jeu n'a pas changé : l'export de la dernière publication est repris"
          else
            outils/godot.sh --modeles-web
            outils/godot.sh --headless --path jeux/lisiere --import
            mkdir -p "$RUNNER_TEMP/lisiere"
            outils/godot.sh --headless --path jeux/lisiere --export-release Web "$RUNNER_TEMP/lisiere/index.html"
            # (un export à moitié fait n'est pas publié)
            test -s "$RUNNER_TEMP/lisiere/index.wasm" && test -s "$RUNNER_TEMP/lisiere/index.pck"
            echo "$source" > "$RUNNER_TEMP/lisiere/source.txt"
            rm -rf lisiere && mv "$RUNNER_TEMP/lisiere" lisiere
            echo "le jeu est exporté"
          fi
          ls -la lisiere
      - name: le prototype Portefaix, pour un navigateur (portefaix/, jeux/portefaix/LISEZ-MOI.md)
        continue-on-error: true          # un export manqué ne retient pas la publication des mondes
        run: |
          # refait seulement quand le jeu a changé ; sinon, l'export de la dernière publication est repris tel quel
          source=$(git rev-parse HEAD:jeux/portefaix)
          if [ -n "$PUBLIE" ] && [ "$(git show "$PUBLIE:portefaix/source.txt" 2>/dev/null)" = "$source" ]; then
            git archive "$PUBLIE" portefaix | tar -x
            echo "le jeu n'a pas changé : l'export de la dernière publication est repris"
          else
            outils/godot.sh --modeles-web
            outils/godot.sh --headless --path jeux/portefaix --import
            mkdir -p "$RUNNER_TEMP/portefaix"
            outils/godot.sh --headless --path jeux/portefaix --export-release Web "$RUNNER_TEMP/portefaix/index.html"
            # (un export à moitié fait n'est pas publié)
            test -s "$RUNNER_TEMP/portefaix/index.wasm" && test -s "$RUNNER_TEMP/portefaix/index.pck"
            echo "$source" > "$RUNNER_TEMP/portefaix/source.txt"
            rm -rf portefaix && mv "$RUNNER_TEMP/portefaix" portefaix
            echo "le jeu est exporté"
          fi
          ls -la portefaix
      - name: publier (la branche publication, réécrite en un seul commit)
        run: |
          git config user.name "orvane"
          git config user.email "orvane@users.noreply.github.com"
          git add -A
          git rm -r -q --cached .github             # (les workflows restent dans main : la publication n'a pas à les porter)
          arbre=$(git write-tree)
          if [ -n "$PUBLIE" ] && [ "$(git rev-parse "$PUBLIE^{tree}")" = "$arbre" ]; then echo "rien de neuf à publier"; exit 0; fi
          if [ -n "$PUBLIE" ] && git diff --cached --quiet "$PUBLIE" -- mondes; then quoi="le code de main"; else quoi="les mondes"; fi
          commit=$(git commit-tree "$arbre" -m "publication $(date -u +%Y-%m-%dT%H:%M) : $quoi (main $(git rev-parse --short HEAD))")
          git push -q -f origin "$commit:refs/heads/publication" || { echo "::error title=publication::GitHub refuse que l'action publie. Dans Settings › Actions › General › Workflow permissions, choisissez « Read and write permissions », puis relancez."; exit 1; }
          echo "publié : $commit"
      - name: signaler un monde en panne
        if: steps.tourner.outcome == 'failure'
        run: exit 1
