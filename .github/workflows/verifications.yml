# Orvane — les vérifications : à chaque PR et à chaque changement de main, le contrat et les bancs rapides ; chaque nuit, les bancs
# longs. Une PR dont une vérification échoue se voit en rouge ; pour qu'elle ne puisse pas être fusionnée, Settings › Branches ›
# « main » : « Require status checks to pass », et cocher « contrat » et les quatre « bancs (k/4) » (hebergement/LISEZ-MOI.md, « Les vérifications »).
name: verifications
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'       # la nuit (après le cycle de 03:00) : les bancs longs, dans leur version entière
  workflow_dispatch:
    inputs:
      quoi:
        description: 'les bancs : rapides, longs ou tous'
        default: 'rapides'
permissions:
  contents: read
concurrency:
  group: verifications-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  contrat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: chaque fichier JavaScript se lit
        run: |
          r=0; for f in $(git ls-files '*.js'); do node --check "$f" || { echo "::error file=$f::ne se lit pas"; r=1; }; done; exit $r
      - name: les types suivent les schémas
        run: |
          node outils/types.js
          git diff --exit-code types/ || { echo "::error::types/orvane.d.ts n'est plus celui des schémas : lancez node outils/types.js et ajoutez-le"; exit 1; }
          npx -y -p typescript@5.6.3 tsc --strict --noEmit types/orvane.d.ts
      - name: les mondes du dépôt respectent le contrat
        run: |
          r=0
          for f in mondes/*/profil.json; do node outils/verifier.js "$f" --profil || r=1; done
          for f in mondes/*/instantane.json mondes/*/amorce.json; do [ -f "$f" ] && { node outils/verifier.js "$f" --instantane || r=1; }; done
          exit $r
      - name: le contrat ne casse rien sans sa version majeure (outils/contrat.js, docs/43)
        env:
          BASE_REF: ${{ github.base_ref }}
          AVANT: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then git fetch -q --depth=1 origin "$BASE_REF"
          elif [ -n "$AVANT" ] && [ "$AVANT" != 0000000000000000000000000000000000000000 ]; then git fetch -q --depth=1 origin "$AVANT"
          else echo "rien à comparer"; exit 0; fi
          node outils/contrat.js --base FETCH_HEAD
      - name: le paquet s'installe et se charge
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          mkdir -p "$RUNNER_TEMP/jeu" && cd "$RUNNER_TEMP/jeu" && npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/orvane-*.tgz
          node -e "const o = require('orvane'); if (!o.Orvane.cycle || !o.Tampon.agreger || o.CONTRAT !== o.version.split('.').slice(0, 2).join('.')) process.exit(1); console.log('orvane', o.version, '· contrat', o.CONTRAT)"
  kits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: le kit Unity (le cœur C#, hors de Unity) lit le monde et fait des lots conformes
        run: |
          dotnet run --project "kits/unity/Tests~" -- "$RUNNER_TEMP/lots-unity"
          for f in "$RUNNER_TEMP"/lots-unity/lot-*.json; do node outils/verifier.js "$f" --lot; done
      - name: le kit Godot se lit (syntaxe GDScript 4 ; Lisière, qui le porte, a son dépôt et sa CI)
        run: |
          pip install -q "gdtoolkit==4.*"
          gdparse kits/godot/addons/orvane/orvane.gd kits/godot/addons/orvane/plugin.gd > /dev/null && echo "le kit Godot se lit"
  bancs:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]           # quatre machines à la fois, chacune une part des bancs, à durées à peu près égales
    name: bancs (${{ matrix.part }}/4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: les bancs
        env:
          QUOI: ${{ github.event.inputs.quoi }}
        run: |
          case "${{ github.event_name }}:$QUOI" in
            schedule:*|*:longs) mode=--longs; delai=18000 ;;
            *:tous) mode=--tous; delai=18000 ;;
            *) mode=; delai=2400 ;;
          esac
          node outils/bancs.js $mode --part ${{ matrix.part }}/4 --jobs 4 --delai $delai
